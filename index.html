                  <div className="bg-[#0A0A0A] border border-[#222] p-6">
                      <h3 className="text-white font-bold mb-4 flex items-center gap-2">

        const LogsContent = () => (
            <div className="space-y-6 animate-fade-in">
                <div className="flex items-center justify-between">
                    <h2 className="text-2xl font-bold text-white tracking-tight">ENGINEERING LOGS</h2>
                    <div className="text-[#FF5F00] text-xs font-bold border border-[#FF5F00] px-2 py-1">SOURCE: MDR.PDF</div>
                </div>

                <div className="space-y-4">
                    <LogCard 
                        id="#ERR-001" type="CRITICAL" title="L298N Thermal Failure"

                     <LogCard

                     <LogCard

                <div className="bg-[#111] border border-[#222] p-6 mt-8">

                    <div className="space-y-4">
                        <ProgressBar label="BATTERY VOLTAGE (7.4V Nominal)" value={90} color="#FF5F00" />
                        <ProgressBar label="SIGNAL INTEGRITY (nRF24L01)" value={82} color="#00FF41" />
                    </div>

        );

        const ArchitectureContent = () => (
            <div className="space-y-8 animate-fade-in">
                <div className="bg-[#111] border border-[#222] p-8 overflow-x-auto">
                    <h2 className="text-white font-bold mb-8">DATA FLOW ARCHITECTURE</h2>
                    <div className="min-w-[600px] flex items-center justify-between text-sm">
                        {/* Glove */}
                        <div className="w-48 bg-[#0A0A0A] border border-gray-700 p-4 relative">

                                <li className="flex justify-between border-b border-[#222] pb-1"><span>Flex Sensor</span> <span>ADC</span></li>

                            </ul>
                        </div>
                        {/* Arrow */}
                        <div className="flex-1 h-[2px] bg-gray-700 relative mx-4">
                            <div className="absolute -top-3 left-1/2 -translate-x-1/2 text-[10px] text-[#FF5F00] font-bold bg-[#050505] px-2 whitespace-nowrap">
                                nRF24L01 (2.4GHz)
                            </div>
                        </div>
                        {/* Robot */}
                        <div className="w-48 bg-[#0A0A0A] border border-gray-700 p-4 relative">
                            <div className="absolute -top-3 left-4 bg-blue-500 text-black text-[10px] font-bold px-2">RX NODE</div>
                            <div className="text-white font-bold mb-2">ROBOT</div>
                            <ul className="space-y-2 text-gray-400 text-xs">
                                <li className="flex justify-between border-b border-[#222] pb-1"><span>nRF Module</span> <span>SPI</span></li>
                                <li className="flex justify-between border-b border-[#222] pb-1"><span>TB6612FNG</span> <span>PWM</span></li>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

        // --- GAME COMPONENT (V2.2 - Recovery Logic & Image Support) ---

        const GameContent = () => {
            const canvasRef = useRef(null);
            const playerImg = useRef(new Image());

            const [gameState, setGameState] = useState('MENU'); // MENU, PLAYING, GAMEOVER
            const [finalScore, setFinalScore] = useState(0);
            const [failReason, setFailReason] = useState("");
            
            // Refs for Game Loop State (Mutable)
            const stateRef = useRef({
                playerLane: 2, // 1, 2, 3
                playerY: 0,
                obstacles: [],
                batteries: [],
                speed: 6,
                score: 0,
                strikes: 0,
                recoveryTimer: 0, // Time to recover from panic
                lastSpawnTime: 0,
                frameCount: 0,
                batteryLevel: 100,
                shake: 0
            });

            // Load Image
            useEffect(() => {
                playerImg.current.src = "https://i.imgur.com/tHcb9zJ.png";
            }, []);

            useEffect(() => {
                if (gameState !== 'PLAYING') return;

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                // Initialize State
                stateRef.current = {
                    playerLane: 2,
                    playerY: canvas.height - 120,
                    obstacles: [],
                    batteries: [],
                    speed: 6, // Base speed
                    score: 0,
                    strikes: 0,
                    recoveryTimer: 0,
                    lastSpawnTime: 0,
                    frameCount: 0,
                    batteryLevel: 100,
                    shake: 0
                };

                const LANE_WIDTH = canvas.width / 3;
                
                // --- CONTROLS ---
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowLeft' && stateRef.current.playerLane > 1) stateRef.current.playerLane--;
                    if (e.key === 'ArrowRight' && stateRef.current.playerLane < 3) stateRef.current.playerLane++;
                };

                let touchStartX = 0;
                const handleTouchStart = (e) => {
                    touchStartX = e.touches[0].clientX;
                };
                const handleTouchEnd = (e) => {
                    const touchEndX = e.changedTouches[0].clientX;
                    const diffX = touchStartX - touchEndX;
                    
                    if (Math.abs(diffX) > 30) {
                        if (diffX > 0 && stateRef.current.playerLane > 1) stateRef.current.playerLane--; // Swipe Left
                        else if (diffX < 0 && stateRef.current.playerLane < 3) stateRef.current.playerLane++; // Swipe Right
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
                canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

                // --- GAME LOOP ---
                const loop = (timestamp) => {
                    const state = stateRef.current;
                    const width = canvas.width;
                    const height = canvas.height;
                    const laneWidth = width / 3;

                    // 1. UPDATE STATE
                    state.frameCount++;
                    state.score++;
                    
                    // Battery Decay
                    if (state.frameCount % 10 === 0) {
                        state.batteryLevel -= 0.2; 
                    }
                    if (state.batteryLevel <= 0) {
                        setFailReason("BATTERY DEPLETED");
                        setFinalScore(Math.floor(state.score / 10));
                        setGameState('GAMEOVER');
                        return;
                    }

                    // Recovery Logic (Subway Surfers Mechanic)
                    if (state.strikes === 1) {
                        state.recoveryTimer--;
                        if (state.recoveryTimer <= 0) {
                            state.strikes = 0; // Threat gone
                        }
                    }

                    // DIFFICULTY SCALING
                    if (state.score % 300 === 0) state.speed += 0.5;

                    // Screen Shake Decay
                    if (state.shake > 0) state.shake--;

                    // Spawn Logic
                    const spawnThreshold = Math.max(500, 1500 - (state.speed * 60)); 

                    if (timestamp - state.lastSpawnTime > spawnThreshold) {
                        const lane = Math.floor(Math.random() * 3) + 1;
                        
                        // 15% Chance to spawn Battery
                        if (Math.random() < 0.15) {
                            state.batteries.push({ lane, y: -100, hit: false, id: Math.random() });
                        } else {
                            state.obstacles.push({ lane, y: -100, hit: false, id: Math.random() });
                        }
                        state.lastSpawnTime = timestamp;
                    }

                    // Move Entities
                    state.obstacles.forEach(obs => obs.y += state.speed);
                    state.batteries.forEach(bat => bat.y += state.speed);
                    
                    // Collision Check: Obstacles
                    state.obstacles.forEach(obs => {
                        if (!obs.hit && obs.y > state.playerY - 40 && obs.y < state.playerY + 40 && obs.lane === state.playerLane) {
                            obs.hit = true;
                            state.strikes++;
                            state.recoveryTimer = 600; // Reset recovery timer (10 seconds @ 60fps)
                            state.shake = 20; // Trigger Shake
                            state.batteryLevel -= 15; // Hit drains battery
                            
                            // Game Over Condition
                            if (state.strikes >= 2) {
                                setFailReason("SOCIAL THREAT IMMINENT");
                                setFinalScore(Math.floor(state.score / 10));
                                setGameState('GAMEOVER');
                                return;
                            }
                        }
                    });

                    // Collision Check: Batteries
                    state.batteries.forEach(bat => {
                        if (!bat.hit && bat.y > state.playerY - 40 && bat.y < state.playerY + 40 && bat.lane === state.playerLane) {
                            bat.hit = true;
                            state.batteryLevel = Math.min(100, state.batteryLevel + 20); // Restore Battery
                        }
                    });

                    // Cleanup
                    state.obstacles = state.obstacles.filter(obs => obs.y < height);
                    state.batteries = state.batteries.filter(bat => bat.y < height && !bat.hit);

                    // 2. DRAWING
                    
                    // Apply Shake
                    ctx.save();
                    if (state.shake > 0) {
                        const dx = (Math.random() - 0.5) * state.shake * 2;
                        const dy = (Math.random() - 0.5) * state.shake * 2;
                        ctx.translate(dx, dy);
                    }

                    // Background
                    ctx.fillStyle = '#111';
                    ctx.fillRect(-20, -20, width+40, height+40); 

                    // Lanes
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(laneWidth, 0); ctx.lineTo(laneWidth, height);
                    ctx.moveTo(laneWidth * 2, 0); ctx.lineTo(laneWidth * 2, height);
                    ctx.stroke();

                    // Draw Batteries
                    state.batteries.forEach(bat => {
                        const x = ((bat.lane - 1) * laneWidth) + (laneWidth/2) - 15;
                        ctx.fillStyle = '#00FF41';
                        ctx.beginPath();
                        ctx.moveTo(x + 15, bat.y);
                        ctx.lineTo(x, bat.y + 20);
                        ctx.lineTo(x + 10, bat.y + 20);
                        ctx.lineTo(x + 5, bat.y + 40);
                        ctx.lineTo(x + 30, bat.y + 15);
                        ctx.lineTo(x + 20, bat.y + 15);
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowColor = '#00FF41';
                        ctx.shadowBlur = 10;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    });

                    // Draw Obstacles
                    state.obstacles.forEach(obs => {
                        const x = ((obs.lane - 1) * laneWidth) + (laneWidth/2) - 25;
                        ctx.fillStyle = obs.hit ? '#555' : '#FF5F00';
                        ctx.fillRect(x, obs.y, 50, 50);
                        ctx.fillStyle = obs.hit ? '#333' : '#CC4C00';
                        ctx.fillRect(x + 5, obs.y + 5, 40, 40);
                    });

                    // Draw Player (Image Rotated 180deg)
                    const playerX = ((state.playerLane - 1) * laneWidth) + (laneWidth/2) - 30; // Centered
                    
                    if (playerImg.current.complete) {
                        ctx.save();
                        // Move to center of player to rotate
                        ctx.translate(playerX + 30, state.playerY + 30);
                        ctx.rotate(Math.PI); // 180 degrees
                        ctx.drawImage(playerImg.current, -30, -30, 60, 60);
                        ctx.restore();
                    } else {
                        // Fallback Box
                        ctx.fillStyle = '#EEE';
                        ctx.fillRect(playerX, state.playerY, 60, 60);
                    }

                    // Draw CHASER (THE WOMAN)
                    if (state.strikes >= 1) {
                        // Distance logic: starts close (100px), drifts back as timer reduces
                        const threatLevel = state.recoveryTimer / 600; // 1.0 to 0.0
                        const chaserDist = 60 + ((1 - threatLevel) * 200); // 60px to 260px behind
                        
                        const chaserY = state.playerY + chaserDist + (Math.sin(state.frameCount * 0.1) * 10);
                        
                        // Fade out as she leaves
                        ctx.globalAlpha = Math.min(1, threatLevel + 0.2); 
                        
                        const chaserX = ((state.playerLane - 1) * laneWidth) + (laneWidth/2);

                        ctx.fillStyle = '#D946EF'; 
                        ctx.beginPath();
                        ctx.arc(chaserX, chaserY, 20, 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillRect(chaserX - 20, chaserY + 20, 40, 50);
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 20px Arial';
                        ctx.fillText('!', chaserX + 25, chaserY);
                        
                        ctx.globalAlpha = 1.0;
                    }

                    ctx.restore(); // Restore Shake transform

                    // HUD: Score
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 20px JetBrains Mono';
                    ctx.fillText(`${Math.floor(state.score / 10)}m`, 20, 40);

                    // HUD: Battery Bar
                    const barWidth = 100;
                    const barHeight = 10;
                    const barX = width - barWidth - 20;
                    const barY = 25;
                    ctx.strokeStyle = '#FFF';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(barX, barY, barWidth, barHeight);
                    ctx.fillStyle = state.batteryLevel > 20 ? '#00FF41' : '#FF0000';
                    ctx.fillRect(barX + 1, barY + 1, (barWidth - 2) * (state.batteryLevel / 100), barHeight - 2);
                    ctx.fillStyle = '#AAA';
                    ctx.font = '10px JetBrains Mono';
                    ctx.fillText("Li-Po CHARGE", barX, barY - 5);

                    if (gameState === 'PLAYING') {
                        animationFrameId = requestAnimationFrame(loop);
                    }
                };

                animationFrameId = requestAnimationFrame(loop);

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('keydown', handleKeyDown);
                    canvas.removeEventListener('touchstart', handleTouchStart);
                    canvas.removeEventListener('touchend', handleTouchEnd);
                };
            }, [gameState]);

            return (
                <div className="flex flex-col items-center justify-center w-full h-[600px] bg-[#000] border border-[#333] relative overflow-hidden select-none">
                    
                    <canvas 
                        ref={canvasRef} 
                        width={350} 
                        height={600} 
                        className={`bg-[#050505] shadow-2xl ${gameState === 'PLAYING' ? '' : 'opacity-30'}`}
                    />

                    {/* MENU OVERLAY */}
                    {gameState === 'MENU' && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center z-20 text-center">
                            <h2 className="text-4xl font-black text-white mb-2 italic tracking-tighter">TRY SHY BOI</h2>
                            <div className="text-[10px] text-gray-500 font-bold border border-gray-800 px-2 py-1 mb-4">V2.2 SIMULATION</div>
                            <p className="text-gray-400 text-sm mb-6 max-w-xs px-4 leading-relaxed">
                                AVOID OBSTACLES.<br/>
                                <span className="text-[#00FF41]">COLLECT GREEN PACKS</span> TO CHARGE.<br/>
                                <span className="text-[#FF5F00]">1ST HIT:</span> PANIC MODE (SURVIVE 10s).<br/>
                                <span className="text-[#D946EF]">2ND HIT:</span> SYSTEM FAILURE.
                            </p>
                            <button 
                                onClick={() => setGameState('PLAYING')}
                                className="bg-[#FF5F00] hover:bg-[#ff7b2e] text-black font-bold py-4 px-10 rounded-full flex items-center gap-2 transition-transform transform active:scale-95"
                            >
                                <Gamepad2 size={24} /> INITIALIZE
                            </button>
                            <div className="mt-8 text-xs text-gray-500 font-mono">
                                SWIPE or ARROW KEYS
                            </div>
                        </div>
                    )}

                    {/* GAME OVER OVERLAY */}
                    {gameState === 'GAMEOVER' && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center z-20 bg-black/90 text-center">
                            <div className="text-[#D946EF] mb-4 animate-bounce">
                                <ShieldAlert size={80} />
                            </div>
                            <h2 className="text-3xl font-black text-white mb-2 uppercase px-4 leading-none">
                                {failReason === "BATTERY DEPLETED" ? "SYSTEM OFFLINE" : "SOCIAL OVERLOAD"}
                            </h2>
                            <p className="text-gray-400 text-sm mb-8 max-w-xs">
                                {failReason === "BATTERY DEPLETED" 
                                    ? "Li-Po battery levels critical. System shutdown initiated." 
                                    : "Social anxiety threshold breached. Emergency evasion failed."}
                            </p>
                            <div className="text-2xl font-mono text-[#FF5F00] mb-8 border border-[#FF5F00] px-4 py-2">
                                DISTANCE: {finalScore}m
                            </div>
                            <button 
                                onClick={() => setGameState('PLAYING')}
                                className="bg-white hover:bg-gray-200 text-black font-bold py-3 px-8 rounded-full"
                            >
                                REBOOT SYSTEM
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // --- MAIN LAYOUT COMPONENT ---

        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const NavButton = ({ id, icon: Icon, label }) => (
                <button 
                    onClick={() => setActiveTab(id)}
                    className={`
                        flex flex-col md:flex-row items-center gap-2 p-3 rounded-lg transition-all md:w-full md:justify-start
                        ${activeTab === id 
                            ? 'text-[#FF5F00] md:bg-[#FF5F00]/10 md:border-r-4 md:border-[#FF5F00]' 
                            : 'text-gray-500 hover:text-gray-300 hover:bg-[#1A1A1A]'}
                    `}
                >
                    <Icon size={24} strokeWidth={activeTab === id ? 2.5 : 2} />
                    <span className="text-[10px] md:text-sm font-bold uppercase tracking-wider">{label}</span>
                </button>
            );

            return (
                <div className="min-h-screen bg-[#050505] text-[#E0E0E0] md:pl-64 pb-20 md:pb-0">
                    
                    {/* DESKTOP SIDEBAR */}
                    <nav className="hidden md:flex fixed left-0 top-0 h-full w-64 bg-[#0A0A0A] border-r border-[#222] flex-col p-6 z-50">
                        <div className="mb-12">
                            <h1 className="text-3xl font-black text-white tracking-tighter italic">SHY<span className="text-[#FF5F00]">.BOI</span></h1>
                            <div className="text-[10px] text-gray-500 mt-1 font-mono">UNIT: ELEC-491-G6</div>
                        </div>
                        <div className="space-y-2">
                            <NavButton id="overview" icon={Activity} label="Status" />
                            <NavButton id="architecture" icon={Layers} label="Architecture" />
                            <NavButton id="logs" icon={Terminal} label="Logs" />
                            <NavButton id="game" icon={Gamepad2} label="Try Shy Boi" />
                        </div>
                        <div className="mt-auto pt-6 border-t border-[#222]">
                            <div className="text-[10px] text-gray-600">
                                ENG: B.KORUYUCU / E.TEYMUR<br/>
                                ADVISOR: U.TEGIN
                            </div>
                        </div>
                    </nav>

                    {/* MOBILE TOP BAR */}
                    <div className="md:hidden fixed top-0 left-0 w-full h-16 bg-[#0A0A0A] border-b border-[#222] flex items-center justify-between px-6 z-40">
                         <h1 className="text-xl font-black text-white tracking-tighter italic">SHY<span className="text-[#FF5F00]">.BOI</span></h1>
                         <div className="text-[10px] text-gray-500 font-bold border border-gray-800 px-2 py-1">V2.2</div>
                    </div>

                    {/* MAIN CONTENT */}
                    <main className="pt-20 md:pt-12 px-6 md:px-12 max-w-6xl mx-auto">
                        {activeTab === 'overview' && <OverviewContent />}
                        {activeTab === 'architecture' && <ArchitectureContent />}
                        {activeTab === 'logs' && <LogsContent />}
                        {activeTab === 'game' && <GameContent />}
                    </main>

                    {/* MOBILE BOTTOM NAV */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-[#0A0A0A] border-t border-[#222] z-50 px-2 py-2 pb-safe flex justify-around items-center">
                        <NavButton id="overview" icon={Activity} label="Status" />
                        <NavButton id="architecture" icon={Layers} label="Arch" />
                        <NavButton id="logs" icon={Terminal} label="Logs" />
                        <NavButton id="game" icon={Gamepad2} label="Sim" />
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
